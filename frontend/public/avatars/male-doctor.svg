<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="skinMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#f6ad55"/>
    </linearGradient>
    <linearGradient id="scrubMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgMale)"/>

  <!-- Body / Lab Coat -->
  <path d="M40 200 C40 155 70 140 100 140 C130 140 160 155 160 200 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Medical V-Neck Scrub inside -->
  <polygon points="85,140 115,140 100,175" fill="url(#scrubMale)"/>
  
  <!-- Lab Coat Lapels -->
  <path d="M72 142 L88 175 L75 200" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M128 142 L112 175 L125 200" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Stethoscope around neck -->
  <path d="M80 145 C80 178 95 190 95 190 C95 190 105 190 120 145" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="95" cy="192" r="7" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <circle cx="95" cy="192" r="3" fill="#cbd5e1"/>

  <!-- Neck -->
  <rect x="88" y="115" width="24" height="28" rx="6" fill="url(#skinMale)"/>

  <!-- Head / Face -->
  <ellipse cx="100" cy="92" rx="34" ry="40" fill="url(#skinMale)"/>

  <!-- Ears -->
  <ellipse cx="65" cy="94" rx="7" ry="11" fill="url(#skinMale)"/>
  <ellipse cx="135" cy="94" rx="7" ry="11" fill="url(#skinMale)"/>

  <!-- Hair (Male - Professional side part) -->
  <path d="M66 84 C66 60 76 48 100 48 C124 48 134 60 134 84 C134 88 128 72 120 70 C108 67 92 68 76 74 C69 77 66 84 66 84 Z" fill="#2d3748"/>
  <path d="M66 82 C65 72 70 56 82 52 C95 48 118 48 130 55 C135 58 135 68 135 78 C135 84 133 88 132 88 C131 82 130 75 125 72 C115 67 85 68 70 78 C67 81 66 82 66 82 Z" fill="#1a202c"/>

  <!-- Eyes & Eyebrows -->
  <path d="M78 80 Q86 77 92 80" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M108 80 Q114 77 122 80" fill="none" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
  
  <ellipse cx="85" cy="88" rx="4" ry="4.5" fill="#2d3748"/>
  <circle cx="86.5" cy="86.5" r="1.5" fill="#ffffff"/>
  
  <ellipse cx="115" cy="88" rx="4" ry="4.5" fill="#2d3748"/>
  <circle cx="116.5" cy="86.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M99 88 L97 99 L103 99" fill="none" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Friendly Smile -->
  <path d="M89 108 Q100 119 111 108" fill="none" stroke="#c53030" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glasses (Optional intellectual medical look) -->
  <rect x="74" y="81" width="22" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="104" y="81" width="22" height="15" rx="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M96 87 L104 87" fill="none" stroke="#64748b" stroke-width="1.5"/>
</svg>
